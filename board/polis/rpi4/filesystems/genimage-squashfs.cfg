# Keep partition sizes and numbering identical for all filesystem benchmarks.
image boot.vfat {
	vfat {
		files = {
			"bcm2711-rpi-4-b.dtb",
			"rpi-firmware/config.txt",
			"rpi-firmware/cmdline.txt",
			"rpi-firmware/start4.elf",
			"rpi-firmware/fixup4.dat",
			"rpi-firmware/overlays",
			"Image",
		}
	}
	size = 128M
}

image data.ext4 {
	ext4 {
		use-mke2fs = true
		label = "polis-data"
	}
	size = 64M
	empty = true
}

image sdcard.img {
	hdimage {
	}

	partition boot {
		partition-type = 0xC
		bootable = "true"
		image = "boot.vfat"
	}

	partition rootfs {
		partition-type = 0x83
		size = 120M
		image = "rootfs.squashfs"
	}

	partition data {
		partition-type = 0x83
		image = "data.ext4"
	}
}
