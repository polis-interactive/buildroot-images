schema = 1
id = "rpi4-usb-host"
description = "Pi 4 USB-A VL805 PCIe host and built-in CDC ACM."
provides = ["usb-host"]
disables = ["usb-diagnostics"]

[kernel]
"CONFIG_USB_SUPPORT" = "y"
"CONFIG_USB" = "y"
"CONFIG_USB_XHCI_HCD" = "y"
"CONFIG_USB_XHCI_PCI" = "y"
"CONFIG_USB_ACM" = "y"
"CONFIG_PCI" = "y"
"CONFIG_PCIE_BRCMSTB" = "y"
"CONFIG_BCM2835_MBOX" = "y"
"CONFIG_RASPBERRYPI_FIRMWARE" = "y"
"CONFIG_RESET_CONTROLLER" = "y"
"CONFIG_RESET_RASPBERRYPI" = "y"
"CONFIG_USB_GADGET" = "n"
"CONFIG_USB_DWCOTG" = "n"
"CONFIG_USB_DWC2" = "n"


# This connection needs ACM only, not inherited USB storage, HID, network,
# capture/audio, serial-converter or alternate host-controller drivers.
"CONFIG_USB_HID" = "n"
"CONFIG_USB_STORAGE" = "n"
"CONFIG_USB_UAS" = "n"
"CONFIG_USB_NET_DRIVERS" = "n"
"CONFIG_MEDIA_USB_SUPPORT" = "n"
"CONFIG_DVB_RTL2832_SDR" = "n"
"CONFIG_SND_USB" = "n"
"CONFIG_USB_SERIAL" = "n"
"CONFIG_USBIP_CORE" = "n"
"CONFIG_USB_DWC3" = "n"
"CONFIG_USB_XHCI_PLATFORM" = "n"
"CONFIG_USB_XHCI_PCI_RENESAS" = "n"
"CONFIG_USB_MON" = "n"

# bcm2711_defconfig also requests these unrelated USB peripherals directly.
# Keep its onboard SDIO Wi-Fi, UART Bluetooth, CSI/I2S and VC4 paths intact.
"CONFIG_BT_HCIBTUSB" = "n"
"CONFIG_BT_HCIBTUSB_MTK" = "n"
