schema = 1
id = "no-usb"
description = "Disable Linux USB host and gadget support."
# Remove upstream input drivers that would otherwise select USB back on.
requires = ["usb-peripheral-only"]
disables = ["usb-diagnostics"]

[kernel]
"CONFIG_USB_SUPPORT" = "n"
"CONFIG_USB" = "n"
"CONFIG_USB_GADGET" = "n"
"CONFIG_USB_XHCI_HCD" = "n"
"CONFIG_USB_XHCI_PCI" = "n"
"CONFIG_USB_DWCOTG" = "n"
"CONFIG_USB_DWC2" = "n"
