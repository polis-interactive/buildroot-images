#:schema ../docs/build-profiles/profile.schema.json
# Slim kernel, LZ4, cut-down firmware, premerged DTB and boot ramdisk.
schema = 1
name = "polis-rpi4-speed"
base = "polis-rpi4-v1" # musl + EROFS + enforced static core
requires = ["boot-diagnostics", "uart-diagnostics", "usb-diagnostics"]

# Order is for readability, not precedence. No silent conflict overrides.
groups = [
  # Product features and measurement support.
  "polis-runtime", "boot-diagnostics",
  "uart-diagnostics", "usb-diagnostics", "kernel-entry-marker",

  # Explicit capability restrictions; these are not part of the base.
  "headless", "no-ethernet", "no-wifi", "bluetooth-uart-routing", "usb-peripheral-only",
  "no-input", "no-32bit", "no-containers", "local-storage-only",

  # Independently selectable optimizations; evidence remains in the runlog.
  "kernel-size", "trim-debug-instrumentation", "no-cron",
  "skip-hat-eeprom", "skip-poe-fan",
  "lz4-kernel", "cutdown-firmware", "premerge-overlays", "boot-ramdisk",
  "eeprom-no-net-install",
]
# Images apply the profile EEPROM settings at first boot.
# prepare-eeprom remains the optional, capture-based host preparation flow.
