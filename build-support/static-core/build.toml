[[steps]]
name = "xz"
when = "BR2_PACKAGE_XZ"
targets = ["xz-dirclean", "xz"]
inputs = ["build-support/static-core", "{buildroot}/package/xz"]
config = ["BR2_PACKAGE_XZ*", "BR2_POLIS_PREFER_STATIC"]
outputs = ["{output}/build/xz-*/.stamp_built", "{output}/target/usr/bin/xz"]

[[steps]]
name = "kmod"
when = "BR2_PACKAGE_KMOD"
depends_on = ["xz"]
targets = ["kmod-dirclean", "kmod"]
inputs = ["build-support/static-core", "patches/musl/kmod", "{buildroot}/package/kmod"]
config = ["BR2_PACKAGE_KMOD*", "BR2_POLIS_PREFER_STATIC", "BR2_GLOBAL_PATCH_DIR"]
outputs = ["{output}/build/kmod-*/.stamp_built", "{output}/target/usr/bin/kmod"]

[[steps]]
name = "dbus"
when = "BR2_PACKAGE_DBUS"
targets = ["dbus-dirclean", "dbus"]
inputs = ["build-support/static-core", "{buildroot}/package/dbus"]
config = ["BR2_PACKAGE_DBUS*", "BR2_POLIS_PREFER_STATIC"]
outputs = ["{output}/build/dbus-*/.stamp_built", "{output}/target/usr/bin/dbus-daemon"]

[[steps]]
name = "iwd"
when = "BR2_PACKAGE_IWD"
depends_on = ["dbus"]
targets = ["iwd-dirclean", "iwd"]
inputs = ["build-support/static-core", "{buildroot}/package/iwd"]
config = ["BR2_PACKAGE_IWD*", "BR2_POLIS_PREFER_STATIC"]
outputs = ["{output}/build/iwd-*/.stamp_built", "{output}/target/usr/libexec/iwd"]
