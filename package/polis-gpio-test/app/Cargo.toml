[package]
name = "polis-gpio-test"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
libc = "0.2"
rppal = { version = "=0.22.1", default-features = false }
tokio = { version = "=1.53.2", default-features = false, features = ["rt", "macros", "time", "signal"] }

[dev-dependencies]
tokio = { version = "=1.53.2", features = ["test-util"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
