<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy context="default">
    <deny own="tv.polis.WifiSetup1"/>
    <deny send_destination="tv.polis.WifiSetup1"/>
  </policy>
  <!-- Initial appliance clients and iwd run as root. iwd's own policy grants
       root its calls and authentication-agent callbacks. No public bus access. -->
  <policy user="root">
    <allow own="tv.polis.WifiSetup1"/>
    <allow send_destination="tv.polis.WifiSetup1"/>
  </policy>
</busconfig>
